# Submission deadlines for top AI conferences, rendered by _pages/deadlines.md.
#
# Fields:
#   id                 unique slug
#   name, year         short name and edition year
#   full_name          long conference name
#   area               ml | nlp | cv (drives the filter chips)
#   abstract_deadline  optional, ISO 8601 with UTC offset
#   deadline           full paper submission, ISO 8601 with UTC offset (AoE = -12:00)
#   status             confirmed (from the official CFP) | estimated (previous year shifted +1 year)
#   conf_dates, location, link, note
#
# Keep every deadline in the same "-12:00" offset format so the Liquid string sort stays chronological.
# Entries with a deadline on or after 2028-01-01 are hidden by the page.
# Last checked: 2026-09-25 against official CFP pages, ccfddl/ccf-deadlines and huggingface/ai-deadlines.

